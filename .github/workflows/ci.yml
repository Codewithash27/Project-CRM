name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aadi_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # The tests read DATABASE_URL from backend/.env (gitignored) and create their own aadi_crm_test database on this server.
      - run: |
          printf 'DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/aadi_crm\nJWT_SECRET=test-jwt-secret-must-be-at-least-32-chars\nCORS_ORIGINS=http://localhost:5173\n' > .env
      - run: python -m pytest -q
