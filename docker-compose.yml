services:
  postgres:
    image: postgres:16-alpine
    container_name: aadi-crm-postgres
    environment:
      POSTGRES_USER: aadi_crm
      POSTGRES_PASSWORD: aadi_crm
      POSTGRES_DB: aadi_crm
    ports:
      - "5432:5432"
    volumes:
      - aadi_crm_pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aadi_crm -d aadi_crm"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aadi_crm_pg:
